    if(q.kind==='num') el.querySelector('input').oninput = ev => { q.resp = ev.target.value; };
    if(q.kind==='expr'){ const inp = el.querySelector('input'), pv = el.querySelector('.preview');
      const upd = () => { const v = inp.value.trim(); if(!v || /nicht/i.test(v)){ pv.innerHTML = ''; return; }
        try { pv.innerHTML = 'Du hast getippt: <span class="m">'+mHtml(mParse(v))+'</span>'; } catch(e) { pv.innerHTML = '<span style="color:var(--bad)">Eingabe prüfen: '+esc(e.message)+'</span>'; } };
      inp.oninput = () => { q.resp = inp.value; upd(); }; upd(); }
  }
  return el;
}

/* Notenprognose: gewichteter Schnitt der letzten Probetests + Übungsstand */
function coverage(sid){
  const sc = store.get('scores',{});
  if(sid==='bw') return EXERCISES.filter(e => sc[e.id] && sc[e.id].done).length / EXERCISES.length;
  if(sid==='bm'){ const ms = store.get('mscores',{}); let ok=0, n=0; MSETS.forEach(s => { n += s.items.length; ok += (ms[s.id]?.ok.length || 0); }); return ok/n; }
  if(sid==='bn'){ const g = store.get('bn.goals',{}); const gp = BN.goals.filter((_,i) => g[i]).length / BN.goals.length;
    return (CH_EX.filter(e => sc[e.id] && sc[e.id].done).length / CH_EX.length + gp) / 2; }
  if(sid==='m162'){ const g = store.get('m162.goals',{}); const gp = M162.goals.filter((_,i) => g[i]).length / M162.goals.length;
    return (M162_EX.filter(e => sc[e.id] && sc[e.id].done).length / M162_EX.length + gp) / 2; }
  return 0;
}
/* Verstanden gesamt: je Thema halb Übungsstand, halb Trefferquote der letzten Probetests.
   Themen ohne Probetest zählen nur mit dem Übungsstand. Liest nur, speichert nichts. */
const PT_TOPICS = {};
const ptTopics = sid => PT_TOPICS[sid] || (PT_TOPICS[sid] = BANKS[sid] ? BANKS[sid]().topics.slice() : []);
function mastery(sid){
  if(!BANKS[sid]) return {pct:0, cov:0, test:null, tested:0, topics:0};
  const cov = coverage(sid), T = ptTopics(sid);
  const H = store.get('ptest.'+sid,[]).filter(h => !h.retry && h.tp);
  let sum = 0, tested = 0, tsum = 0;
  T.forEach(t => {
    const L = H.filter(h => h.tp[t] && h.tp[t][1] > 0).slice(-5);
    if(!L.length){ sum += cov; return; }
    let w = 0, r = 0; L.forEach((h,i) => { w += i+1; r += (i+1) * h.tp[t][0] / h.tp[t][1]; });
    tested++; tsum += r/w; sum += (cov + r/w) / 2;
  });
  const total = T.length ? sum / T.length : cov;
  return {pct:Math.round(Math.min(1, Math.max(0, total))*100), cov, test:tested ? tsum/tested : null, tested, topics:T.length};
}
const masteryText = m => m.test===null ? `Verstanden ${m.pct} %: noch kein Probetest, nur Übungsstand (${Math.round(m.cov*100)} %)`
  : `Verstanden ${m.pct} %: Übungsstand ${Math.round(m.cov*100)} % und Probetests ${Math.round(m.test*100)} % richtig (${m.tested} von ${m.topics} Themen getestet)`;
function predict(sid, H){
  if(!H.length) return null;
  const last = H.slice(-5); let ws = 0, s = 0;
  last.forEach((h,i) => { ws += i+1; s += (i+1)*h.note; });
  const base = s/ws, cov = coverage(sid), adj = (cov-0.5)*0.3;
  const p = Math.min(6, Math.max(1, base+adj));
  const sd = last.length>1 ? Math.sqrt(last.reduce((a,h) => a + (h.note-base)**2, 0) / (last.length-1)) : 0;
  const spread = Math.max(sd, last.length===1 ? 0.75 : last.length<4 ? 0.5 : 0.25);
  const r4 = x => Math.round(x*4)/4;
  return {note:r4(p), lo:r4(Math.max(1,p-spread)), hi:r4(Math.min(6,p+spread)), base, adj, cov, n:H.length, trend:H.length>1 ? H[H.length-1].note - H[H.length-2].note : 0};
}
const fmtN = x => x.toFixed(2).replace(/0$/,'');
function ptChart(H){
  const L = H.slice(-10); if(L.length < 2) return '';
  const W = 300, Hh = 96, bw = W/L.length, y = n => Hh-12-(n-1)/5*(Hh-26);
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;max-width:520px;height:auto;margin:var(--s2) 0 var(--s1)" role="img" aria-label="Verlauf der Probetest-Noten">
    <line x1="0" x2="${W}" y1="${y(4)}" y2="${y(4)}" stroke="currentColor" stroke-dasharray="4 4" opacity=".45"/>
    ${L.map((h,i) => { const x = i*bw + bw*0.2, w = bw*0.6, top = y(h.note);
      return `<rect x="${x}" y="${top}" width="${w}" height="${Hh-12-top}" rx="3" fill="${h.note>=4 ? 'var(--c,var(--accent))' : 'var(--bad)'}"/><text x="${x+w/2}" y="${top-3}" font-size="9" text-anchor="middle" fill="currentColor">${h.note.toFixed(1)}</text>`; }).join('')}
  </svg><div class="muted" style="font-size:var(--t-xs);font-family:var(--f-ui)">Deine letzten Probetests · gestrichelte Linie = Note 4</div>`;
}
function topicRows(tp){
  return Object.entries(tp).map(([t,[g,m]]) => [t, g/m, g, m]).sort((a,b) => a[1]-b[1]).map(([t,p,g,m]) =>
    `<tr><td>${esc(t)}</td><td style="width:45%"><div class="progress"><i style="width:${Math.round(p*100)}%;${p<0.6?'background:var(--bad)':''}"></i></div></td><td>${Math.round(p*100)} %</td></tr>`).join('');
}
function ptPrognose(s){
  const H = store.get('ptest.'+s.id,[]).filter(h => !h.retry), p = predict(s.id, H);
  if(!p) return `<div class="card"><h3>Notenprognose</h3><p class="muted">Mach einen ersten Probetest, dann schätze ich deine Note.</p></div>`;
  const agg = {}; H.forEach(h => Object.entries(h.tp||{}).forEach(([t,[g,m]]) => { agg[t] = agg[t] || [0,0]; agg[t][0] += g; agg[t][1] += m; }));
  const weak = Object.entries(agg).map(([t,[g,m]]) => [t, g/m]).filter(r => r[1] < 0.75).sort((a,b) => a[1]-b[1]).slice(0,2);
  const dl = examDays(s);
  const unsure = p.n < 3 ? 'Noch unsicher: Mach mindestens 3 Probetests für eine verlässliche Prognose.' : p.cov < 0.4 ? 'Achtung: Du hast erst wenig vom Stoff geübt. Die Prognose kann zu optimistisch sein.' : '';
  return `<div class="card"><h3>Notenprognose</h3>
    <div style="display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap">
      <div class="big" style="margin:0;color:${p.note>=4 ? 'var(--c,var(--accent))' : 'var(--bad)'}">${fmtN(p.note)}</div>
      <div style="flex:1 1 240px"><b>Erwartete Note im Test: etwa ${fmtN(p.lo)} bis ${fmtN(p.hi)}</b>
        <p class="muted" style="margin:var(--s1) 0 0;font-size:var(--t-s);font-family:var(--f-ui)">Basis: Ø deiner letzten ${Math.min(5,p.n)} Probetest${p.n>1?'s':''} = ${p.base.toFixed(2)} (neuere zählen mehr) · Übungsstand ${Math.round(p.cov*100)} % (${p.adj>=0?'+':''}${p.adj.toFixed(2)})
        ${p.n>1 ? ` · Trend: ${p.trend>0.05 ? 'besser' : p.trend<-0.05 ? 'schlechter' : 'gleich'}` : ''}${dl!==null && dl>=0 ? ` · Test in ${dl} Tag${dl===1?'':'en'}` : ''}</p>
        ${unsure ? `<p style="margin:var(--s2) 0 0;font-size:var(--t-s);font-family:var(--f-ui)" class="fb warn">${unsure}</p>` : ''}</div></div>
    <p style="margin:var(--s2) 0 0;font-size:var(--t-s);font-family:var(--f-ui)"><b>${esc(masteryText(mastery(s.id)))}</b></p>
    ${ptChart(H)}
    ${Object.keys(agg).length ? `<h4>Trefferquote nach Thema (alle Probetests)</h4><table>${topicRows(agg)}</table>` : ''}
    ${weak.length ? `<p style="margin-top:var(--s3)"><b>So verbesserst du die Note am meisten:</b> Übe zuerst ${weak.map(w => `<b>${esc(w[0])}</b> (${Math.round(w[1]*100)} %)`).join(' und ')}.</p>
      <div class="row"><button class="btn ghost" data-go="theory">Theorie dazu</button><button class="btn ghost" data-go="ex">Passende Übungen</button></div>` : ''}
    <p class="muted" style="font-size:var(--t-xs);margin-top:var(--s2);font-family:var(--f-ui)">Die Prognose ist eine Schätzung aus deinen Probetests, keine Garantie. Note = 1 + 5 × Punkte ÷ Maximum.</p></div>`;
}

const PT = {};
let ptTimer = null;
const ptState = sid => PT[sid] || (PT[sid] = {phase:'setup', n:10, time:0, topics:null});
function ptBindGo(v){ v.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { tab = b.dataset.go; store.set('tab',tab); exOpen = null; render(); window.scrollTo(0,0); }); }
function ptStart(sid, qs, retry){
  const st = ptState(sid);
  qs.forEach(q => { delete q.resp; delete q.score; delete q.msg; delete q.rights; });
  Object.assign(st, {qs, phase:'run', retry:!!retry, endAt: st.time ? Date.now() + st.time*60000 : 0});
  ptTick(); render(); window.scrollTo(0,0);
}
function ptTick(){
  clearInterval(ptTimer);
  ptTimer = setInterval(() => {
    let running = false;
    Object.entries(PT).forEach(([sid,st]) => { if(st.phase==='run' && st.endAt){ running = true; if(Date.now() >= st.endAt) ptSubmit(sid, true); } });
    const st = PT[cur], el = document.getElementById('ptTime');
    if(el && st && st.endAt){ const r = Math.max(0, st.endAt - Date.now()); el.textContent = `${Math.floor(r/60000)}:${String(Math.floor(r/1000)%60).padStart(2,'0')}`; }
    if(!running) clearInterval(ptTimer);
  }, 500);
}
function ptSubmit(sid, timeUp){
  const st = ptState(sid); if(st.phase!=='run') return;
  let pts = 0; const tp = {};
  st.qs.forEach(q => { q.score = scoreQ(q); pts += q.score; tp[q.topic] = tp[q.topic] || [0,0]; tp[q.topic][0] += q.score; tp[q.topic][1] += 1; });
  const max = st.qs.length, note = 1 + 5*pts/max;
  st.result = {pts, max, note, tp, timeUp:!!timeUp};
  const H = store.get('ptest.'+sid,[]);
  H.push({d:todayKey(), note:Math.round(note*100)/100, pts:Math.round(pts*10)/10, max, tp, retry:st.retry});
  store.set('ptest.'+sid, H.slice(-30));
  st.phase = 'done'; st.endAt = 0;
  if(sid===cur && tab==='test'){ render(); window.scrollTo(0,0); }
}
function viewPTest(v, s){
  if(!BANKS[s.id]){ v.innerHTML = `<div class="card empty">Für dieses Fach gibt es noch keine Unterlagen. Sobald Material drin ist, kannst du hier Probetests machen.</div>`; return; }
  const st = ptState(s.id), {topics, bank} = BANKS[s.id]();
  if(!st.topics) st.topics = topics.slice();
  if(st.phase==='run') return ptRun(v, s, st);
  if(st.phase==='done') return ptDone(v, s, st);
  const kinds = [...new Set(bank.map(b => b.make().kind))].map(k => PT_KIND[k]);
  v.innerHTML = `<div class="card ex"><h3>Probetest-Generator</h3>
      <p class="muted">Jeder Test wird neu zusammengestellt, gemischt aus ${bank.length} Fragen und Zufallsaufgaben. Fragetypen: ${kinds.join(', ')}. Danach bekommst du eine Note und eine Prognose für den echten Test.</p>
      <h4>Anzahl Fragen</h4><div class="subtabs">${[10,15,20].map(n => `<button class="chip ${st.n===n?'on':''}" data-n="${n}">${n} Fragen</button>`).join('')}</div>
      <h4>Zeitlimit</h4><div class="subtabs">${[0,15,30,45].map(t => `<button class="chip ${st.time===t?'on':''}" data-time="${t}">${t ? t+' Min.' : 'Ohne'}</button>`).join('')}</div>
      <h4>Themen</h4>${topics.map(t => `<label class="goal"><input type="checkbox" data-tp="${esc(t)}" ${st.topics.includes(t)?'checked':''}><span>${esc(t)} <span class="muted">(${bank.filter(b => b.topic===t).length})</span></span></label>`).join('')}
      <div class="row" style="margin-top:var(--s3)"><button class="btn" id="ptGo">Test erstellen und starten</button><span class="fb bad" id="ptErr"></span></div></div>
    ${ptPrognose(s)}`;
  v.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { st.n = +b.dataset.n; viewPTest(v, s); });
  v.querySelectorAll('[data-time]').forEach(b => b.onclick = () => { st.time = +b.dataset.time; viewPTest(v, s); });
  v.querySelectorAll('[data-tp]').forEach(c => c.onchange = () => { st.topics = topics.filter(t => v.querySelector(`[data-tp="${CSS.escape(t)}"]`).checked); });
  $('#ptGo').onclick = () => { if(!st.topics.length){ $('#ptErr').textContent = 'Wähle mindestens ein Thema.'; return; } ptStart(s.id, buildPTest(s.id, st.n, st.topics)); };
  ptBindGo(v);
}
function ptRun(v, s, st){
  v.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)">
      <button class="btn ghost" id="ptCancel">Abbrechen</button><span class="stats"><span id="ptCount"></span>${st.endAt ? ' · Zeit: <b id="ptTime"></b>' : ''}</span><button class="btn" id="ptSubmit">Abgeben</button></div>
    ${st.retry ? '<p class="muted">Wiederholung deiner Fehler (zählt nicht für die Prognose).</p>' : ''}<div id="ptList"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="ptSubmit2">Test abgeben</button></div>`;
  const list = $('#ptList'); st.qs.forEach((q,i) => list.appendChild(ptQEl(q, i, false)));
  const upd = () => { $('#ptCount').textContent = `${st.qs.filter(ptAnswered).length} / ${st.qs.length} beantwortet`; };
  ['input','change'].forEach(ev => list.addEventListener(ev, upd)); upd();
  $('#ptCancel').onclick = () => { if(confirm('Test abbrechen? Deine Antworten gehen verloren.')){ st.phase = 'setup'; st.endAt = 0; render(); } };
  const submit = () => { const open = st.qs.filter(q => !ptAnswered(q)).length;
    if(open && !confirm(`${open} Frage${open===1?' ist':'n sind'} noch offen. Trotzdem abgeben?`)) return; ptSubmit(s.id); };
  $('#ptSubmit').onclick = submit; $('#ptSubmit2').onclick = submit;
  if(st.endAt) ptTick();
}
function ptDone(v, s, st){
  const {pts, max, note, tp, timeUp} = st.result, cls = note>=5 ? 'good' : note>=4 ? 'mid' : 'low';
  const wrong = st.qs.filter(q => q.score < 1);
  v.innerHTML = `<div class="card" style="text-align:center">
      <div class="muted">${st.retry ? 'Fehler-Wiederholung' : 'Probetest'} · Resultat${timeUp ? ' (Zeit abgelaufen)' : ''}</div>
      <div class="big">${note.toFixed(1)}</div><span class="badge ${cls}">${fmtP(Math.round(pts*10)/10)} von ${max} Punkten · gerundet ${(Math.round(note*2)/2).toFixed(1)}</span>
      <div class="row" style="justify-content:center;margin-top:var(--s3)"><button class="btn" id="ptNew">Neuer Probetest</button>
        ${wrong.length ? `<button class="btn ghost" id="ptRetry">Nur Fehler wiederholen (${wrong.length})</button>` : ''}<button class="btn ghost" id="ptSetup">Einstellungen</button></div></div>
    ${ptPrognose(s)}
    <div class="card"><h3>Dieser Test nach Thema</h3><table>${topicRows(tp)}</table></div>
    <h3 style="margin:var(--s4) 0 var(--s2)">Auswertung</h3><div id="ptList"></div>`;
  const list = $('#ptList'); st.qs.forEach((q,i) => list.appendChild(ptQEl(q, i, true)));
  $('#ptNew').onclick = () => ptStart(s.id, buildPTest(s.id, st.n, st.topics));
  if($('#ptRetry')) $('#ptRetry').onclick = () => ptStart(s.id, shuffle(wrong), true);
  $('#ptSetup').onclick = () => { st.phase = 'setup'; render(); };
  ptBindGo(v);
}

   target:[{n:'Rechnung', a:['RechnungNr','Datum','KundeNr'], pk:['RechnungNr']}, {n:'Kunde', a:['KundeNr','Kundenname','PLZ'], pk:['KundeNr']}, {n:'Ort', a:['PLZ','Ort'], pk:['PLZ']}]},
  {t:'Teilnahme', pk:['KursNr','SchülerNr'], cols:['KursNr','SchülerNr','Note'], rows:[['K1','10','5.5'],['K1','11','4.5'],['K2','10','6.0']],
   deps:{Note:'full'},
   target:[{n:'Teilnahme', a:['KursNr','SchülerNr','Note'], pk:['KursNr','SchülerNr']}]}
];
const depMain = d => Array.isArray(d) ? d[0] : d;
const depAcc = d => Array.isArray(d) ? d : [d];
function depType(d){ return d.split(':')[0]; }
function depLabel(d, t){ const [k,x] = d.split(':');
  return {full:`voll: vom ganzen PK (${t ? t.pk.join(' + ') : 'PK'})`, part:`teilweise: nur von ${x}`, trans:`transitiv: über ${x}`, multi:'nicht atomar (mehrere Werte in einer Zelle)'}[k]; }
const DEP_SHORT = {full:'voll', part:'teilweise', trans:'transitiv', multi:'nicht atomar'};
function nfOfTask(t){ const ds = Object.values(t.deps).map(d => depType(depMain(d)));
  return ds.includes('multi') ? '0' : ds.includes('part') ? '1' : ds.includes('trans') ? '2' : '3'; }
const NF_REASON = {'0':'Mindestens ein Attribut ist nicht atomar → nicht einmal 1NF.', '1':'Ein Nichtschlüsselattribut hängt nur von einem Teil des PK ab (teilweise Abhängigkeit) → 1NF, aber nicht 2NF.',
  '2':'Ein Nichtschlüsselattribut hängt von einem anderen Nichtschlüsselattribut ab (transitiv) → 2NF, aber nicht 3NF.', '3':'Alle Nichtschlüsselattribute hängen voll und direkt vom PK ab → 3NF.'};
function depArrows(t){
  return Object.entries(t.deps).map(([a,d]) => { const m = depMain(d), [k,x] = m.split(':');
    const from = k==='full' ? t.pk.join(' + ') : k==='multi' ? 'mehrere Werte' : x;
    return `<div class="dep"><span class="dk">${esc(from)}</span><span>→</span><span class="dv">${esc(a)}</span><span class="dtag ${k}">${DEP_SHORT[k]}</span></div>`; }).join('');
}
function fkOf(target, tab){ return tab.a.filter(a => !tab.pk.includes(a) && target.some(o => o!==tab && o.pk.length===1 && o.pk[0]===a))
  .concat(tab.pk.filter(a => target.some(o => o!==tab && o.pk.length===1 && o.pk[0]===a && tab.pk.length>1))); }
function targetHtml(target){
  return target.map(tb => { const fk = fkOf(target, tb);
    return `<div style="margin:var(--s1) 0"><b>${esc(tb.n)}</b>(${tb.a.map(a => `${tb.pk.includes(a) ? `<u>${esc(a)}</u>` : esc(a)}${fk.includes(a) ? ' <span class="muted">FK</span>' : ''}`).join(', ')})</div>`; }).join('');
}

const nfl = {sec:'learn', di:0, si:0, split:null, q:null, qp:null, qr:0, qt:0, qs:0};
function nfProg(){ return store.get('nf.prog', {learn:{}, dep:{}, split:{}}); }
function nfSaveProg(fn){ const p = nfProg(); fn(p); store.set('nf.prog', p); }

function viewNFLab(v){
  const p = nfProg();
  const L = Object.values(p.learn).filter(Boolean).length, D = Object.values(p.dep).filter(Boolean).length, S = Object.values(p.split).filter(Boolean).length;
  const secs = [['learn',`Lernen (${L}/6)`],['dep',`Abhängigkeiten (${D}/${NF_TASKS.length})`],['split',`Zerlegen (${S}/${NF_TASKS.length})`],['quick',`Schnell-Check`]];
  v.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:var(--s3)"><button class="btn ghost" id="back">← Alle Übungen</button><span class="muted">Normalformen-Lernbereich</span></div>
    <div class="subtabs">${secs.map(s => `<button class="chip ${nfl.sec===s[0]?'on':''}" data-sec="${s[0]}">${s[1]}</button>`).join('')}</div><div id="nfbody"></div>`;
  $('#back').onclick = () => openEx(null);
  v.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { nfl.sec = b.dataset.sec; viewNFLab(v); });
  ({learn:nfLearn, dep:nfDep, split:nfSplit, quick:nfQuick})[nfl.sec]($('#nfbody'), v);
}

function nfLearn(el, v){
  const p = nfProg();
  const ex = (cols, pk, rows) => nfTable(cols, pk, rows);
  const S = [
    ['1. Warum normalisieren?', `<p>Ziel ist, <b>Redundanzen</b> zu vermeiden: Jede Information soll nur <b>einmal</b> gespeichert sein. Sonst drohen die drei Anomalien (Einfügen, Ändern, Löschen).</p>
      <p>Normalisieren heisst: Eine grosse Tabelle wird Schritt für Schritt in mehrere kleinere Tabellen aufgeteilt, die über Schlüssel verbunden sind. Jede Normalform baut auf der vorherigen auf: <b>3NF ⊂ 2NF ⊂ 1NF</b>.</p>`],
    ['2. Funktionale Abhängigkeit: das Werkzeug', `<p><b>A → B</b> heisst: «Wenn ich A kenne, kenne ich auch B.» Zu jedem A-Wert gibt es genau einen B-Wert.</p>
      <div class="dep"><span class="dk">PLZ</span>→<span class="dv">Ort</span></div><div class="dep"><span class="dk">ArtikelNr</span>→<span class="dv">Bezeichnung</span></div>
      <p>Drei Arten, wie ein Nichtschlüsselattribut abhängen kann:</p>
      <table><tr><th>Art</th><th>Bedeutung</th><th>verletzt</th></tr>
      <tr><td><span class="dtag full">voll</span></td><td>hängt vom <b>ganzen</b> PK ab, und zwar direkt</td><td>nichts, so soll es sein</td></tr>
      <tr><td><span class="dtag part">teilweise</span></td><td>hängt nur von einem <b>Teil</b> eines zusammengesetzten PK ab</td><td>2NF</td></tr>
      <tr><td><span class="dtag trans">transitiv</span></td><td>hängt von einem <b>anderen Nichtschlüssel</b> ab (PK → X → Y)</td><td>3NF</td></tr></table>
      <p class="muted">Tipp: Teilweise Abhängigkeiten gibt es nur bei einem <b>zusammengesetzten</b> PK (zwei oder mehr Spalten).</p>`],
    ['3. Erste Normalform (1NF)', `<div class="formelbox"><b>Regel:</b> Jede Zelle enthält genau <b>einen</b> Wert (atomar). Keine Listen, keine Wiederholungsgruppen (Fach1, Fach2, Fach3). Es gibt einen PK.</div>
      <p><b>Verletzt:</b></p>${ex(['SchülerNr','Name','Hobbys'],['SchülerNr'],[['10','Ana','Fussball, Gamen']])}
      <p><b>So behebst du es:</b> Die Liste kommt in eine eigene Tabelle, eine Zeile pro Wert.</p>
      ${ex(['SchülerNr','Name'],['SchülerNr'],[['10','Ana']])}${ex(['SchülerNr','Hobby'],['SchülerNr','Hobby'],[['10','Fussball'],['10','Gamen']])}
      <p class="muted">Auch «Vorname Nachname» in einem Feld oder «Bahnhofstr. 3, 8000 Zürich» gilt oft als nicht atomar. Aufteilen in Vorname/Nachname bzw. Strasse/PLZ/Ort.</p>`],
    ['4. Zweite Normalform (2NF)', `<div class="formelbox"><b>Regel:</b> 1NF <b>und</b> jedes Nichtschlüsselattribut hängt vom <b>ganzen</b> PK ab, keine teilweisen Abhängigkeiten.</div>
      <p><b>Verletzt</b> (PK = BestellNr + ArtikelNr):</p>${ex(['BestellNr','ArtikelNr','Menge','Bezeichnung'],['BestellNr','ArtikelNr'],[['501','A1','2','Stift'],['502','A1','1','Stift']])}
      <div class="dep"><span class="dk">ArtikelNr</span>→<span class="dv">Bezeichnung</span><span class="dtag part">teilweise</span></div>
      <p><b>So behebst du es:</b> Das teilweise abhängige Attribut kommt zusammen mit seinem Schlüsselteil in eine neue Tabelle. Der Schlüsselteil bleibt als FK in der alten Tabelle.</p>
      ${ex(['BestellNr','ArtikelNr','Menge'],['BestellNr','ArtikelNr'],[['501','A1','2'],['502','A1','1']])}${ex(['ArtikelNr','Bezeichnung'],['ArtikelNr'],[['A1','Stift']])}
      <p class="muted">Abkürzung: Ist der PK nur <b>eine</b> Spalte und die Tabelle in 1NF, ist sie automatisch in 2NF.</p>`],
    ['5. Dritte Normalform (3NF)', `<div class="formelbox"><b>Regel:</b> 2NF <b>und</b> kein Nichtschlüsselattribut hängt von einem anderen Nichtschlüsselattribut ab, keine transitiven Abhängigkeiten.</div>
      <p><b>Verletzt</b>:</p>${ex(['PersonNr','Name','PLZ','Ort'],['PersonNr'],[['1','Meier','8000','Zürich'],['3','Bär','8000','Zürich']])}
      <div class="dep"><span class="dk">PersonNr</span>→<span class="dv">PLZ</span>→<span class="dv">Ort</span><span class="dtag trans">transitiv</span></div>
      <p><b>So behebst du es:</b> Das transitiv abhängige Attribut kommt mit dem Attribut, von dem es abhängt, in eine neue Tabelle. Dieses Attribut wird dort PK und bleibt in der alten Tabelle als FK.</p>
      ${ex(['PersonNr','Name','PLZ'],['PersonNr'],[['1','Meier','8000']])}${ex(['PLZ','Ort'],['PLZ'],[['8000','Zürich']])}
      <p class="muted">Merksatz: Jedes Attribut hängt vom Schlüssel ab (1NF), vom ganzen Schlüssel (2NF) und von nichts als dem Schlüssel (3NF).</p>`],
    ['6. Prüfschema: In welcher NF ist die Tabelle?', `<div class="flow">
      <div class="fq">1. Sind alle Werte atomar (ein Wert pro Zelle)?</div><div class="fa"><b class="no">Nein</b> → <b>nicht in 1NF</b>. &nbsp; <b class="yes">Ja</b> → weiter</div>
      <div class="fq">2. Ist der PK zusammengesetzt, und hängt ein Nichtschlüssel nur von einem Teil davon ab?</div><div class="fa"><b class="no">Ja</b> → <b>1NF</b> (nicht 2NF). &nbsp; <b class="yes">Nein</b> (oder PK einspaltig) → weiter</div>
      <div class="fq">3. Hängt ein Nichtschlüssel von einem anderen Nichtschlüssel ab?</div><div class="fa"><b class="no">Ja</b> → <b>2NF</b> (nicht 3NF). &nbsp; <b class="yes">Nein</b> → <b>3NF</b></div></div>
      <h4>Häufige Fehler</h4><ul><li>Bei einem einspaltigen PK die 3NF vergessen: PLZ → Ort ist trotzdem ein Problem.</li>
      <li>Beim Zerlegen den Schlüssel nicht mitnehmen: Die neue Tabelle braucht ihren PK, die alte behält ihn als FK.</li>
      <li>Werte, die zufällig gleich sind, sind noch keine Abhängigkeit: Zwei Leute mit Name «Meier» → Name bestimmt nichts.</li></ul>`]
  ];
  el.innerHTML = S.map((s,i) => `<div class="card"><h3>${s[0]}</h3>${s[1]}
    <label class="understood"><input type="checkbox" data-u="${i}" ${p.learn[i]?'checked':''}> Verstanden</label></div>`).join('') +
    `<div class="row"><button class="btn" id="toDep">Weiter: Abhängigkeiten erkennen →</button></div>`;
  el.querySelectorAll('[data-u]').forEach(c => c.onchange = () => { nfSaveProg(pp => pp.learn[c.dataset.u] = c.checked); viewNFLab(v); });
  $('#toDep').onclick = () => { nfl.sec = 'dep'; viewNFLab(v); window.scrollTo(0,0); };
}

function nfTaskNav(el, kind, idx, onPick){
  const p = nfProg()[kind];
  const nav = document.createElement('div'); nav.className = 'nfnav';
  nav.innerHTML = NF_TASKS.map((t,i) => `<button class="chip ${i===idx?'on':''} ${p[i]?'done':''}" data-i="${i}">${esc(t.t)}${p[i]?' (erledigt)':''}</button>`).join('');
  nav.querySelectorAll('[data-i]').forEach(b => b.onclick = () => onPick(+b.dataset.i));
  el.prepend(nav);
}
function nfDep(el, v){
  const i = nfl.di, t = NF_TASKS[i], nonkeys = t.cols.filter(c => !t.pk.includes(c));
  const opts = a => ['full'].concat(t.pk.length>1 ? t.pk.map(x => 'part:'+x) : [], nonkeys.filter(x => x!==a).map(x => 'trans:'+x), ['multi']);
  el.innerHTML = `<div class="card ex"><div class="meta">Abhängigkeiten erkennen · Tabelle ${i+1} von ${NF_TASKS.length}</div><h3>${esc(t.t)}</h3>
      <p class="muted">Unterstrichen = Primärschlüssel. Bestimme für jedes Nichtschlüsselattribut, wovon es abhängt.</p>${nfTable(t.cols, t.pk, t.rows)}
      ${nonkeys.map(a => `<div class="q"><div><b>${esc(a)}</b> hängt ab …<div class="fb"></div></div><select data-a="${esc(a)}"><option value="">–</option>${opts(a).map(o => `<option value="${o}">${esc(depLabel(o,t))}</option>`).join('')}</select></div>`).join('')}
      <div class="q"><div><b>Höchste Normalform</b> dieser Tabelle<div class="fb" id="nffb"></div></div><select id="nfsel"><option value="">–</option>${Object.entries(NF_LABEL).map(([k,l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="row" style="margin-top:var(--s3)"><button class="btn" id="chk">Prüfen</button><button class="btn ghost" id="sol">Lösung zeigen</button><span class="score" id="sc"></span></div>
      <div id="res"></div></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="prev" ${i?'':'disabled'}>← Vorherige</button>
      <button class="btn ghost" id="toSplit">Diese Tabelle zerlegen</button><button class="btn" id="next" ${i<NF_TASKS.length-1?'':'disabled'}>Nächste →</button></div>`;
  nfTaskNav(el, 'dep', i, j => { nfl.di = j; nfDep(el, v); });
  const sels = [...el.querySelectorAll('[data-a]')], nfs = $('#nfsel');
  const check = reveal => {
    let g = 0;
    sels.forEach(s => { const d = t.deps[s.dataset.a]; if(reveal) s.value = depMain(d);
      const ok = depAcc(d).includes(s.value); g += ok; mark(s, ok);
      const fb = s.closest('.q').querySelector('.fb'); fb.className = 'fb '+(ok?'ok':'bad'); fb.textContent = ok ? 'Richtig: '+depLabel(s.value,t) : 'Falsch. Richtig wäre: '+depLabel(depMain(d),t); });
    const nf = nfOfTask(t); if(reveal) nfs.value = nf; const okN = nfs.value===nf; g += okN; mark(nfs, okN);
    $('#nffb').className = 'fb '+(okN?'ok':'bad'); $('#nffb').textContent = (okN?'Richtig. ':'Falsch. Richtig wäre: '+NF_LABEL[nf]+'. ') + NF_REASON[nf];
    const tot = sels.length + 1; $('#sc').className = 'score badge '+(g===tot?'good':g/tot>=.5?'mid':'low'); $('#sc').textContent = reveal ? 'Lösung eingeblendet' : `${g} / ${tot} richtig`;
    $('#res').innerHTML = `<h4>Abhängigkeiten</h4>${depArrows(t)}<h4>Zerlegt in 3NF</h4>${targetHtml(t.target)}`;
    if(!reveal && g===tot){ nfSaveProg(pp => pp.dep[i] = true); }
  };
  $('#chk').onclick = () => check(false); $('#sol').onclick = () => check(true);
  $('#prev').onclick = () => { nfl.di = i-1; nfDep(el, v); };
  $('#next').onclick = () => { nfl.di = i+1; nfDep(el, v); };
  $('#toSplit').onclick = () => { nfl.si = i; nfl.split = null; nfl.sec = 'split'; viewNFLab(v); };
}

function nfSplit(el, v){
  const i = nfl.si, t = NF_TASKS[i], k = t.target.length;
  const attrs = [...new Set(t.target.flatMap(tb => tb.a))];
  if(!nfl.split || nfl.split.i!==i) nfl.split = {i, g:attrs.map(() => Array(k).fill(0))};
  const G = nfl.split.g;
  const sym = s => s===2 ? 'PK' : s===1 ? 'Ja' : '';
  el.innerHTML = `<div class="card ex"><div class="meta">Selbst zerlegen · Tabelle ${i+1} von ${NF_TASKS.length}</div><h3>${esc(t.t)} in die 3NF bringen</h3>
      ${nfTable(t.cols, t.pk, t.rows)}
      <p>Verteile die Attribute auf <b>${k} Tabelle${k>1?'n':''}</b>. Klick auf ein Feld: <b>Ja</b> = Attribut gehört in die Tabelle, nochmal klicken = <b>PK</b> = Primärschlüssel, nochmal = leer.
      ${k===1 ? 'Diese Tabelle ist schon in 3NF, also nur den PK richtig setzen.' : ''}</p>
      <div class="tablewrap"><table class="split"><tr><th>Attribut</th>${Array.from({length:k}, (_,c) => `<th>Tabelle ${c+1}</th>`).join('')}</tr>
        ${attrs.map((a,r) => `<tr><td>${esc(a)}</td>${G[r].map((s,c) => `<td><button class="cellbtn ${s===2?'pk':s===1?'on':''}" data-r="${r}" data-c="${c}">${sym(s)}</button></td>`).join('')}</tr>`).join('')}</table></div>
      <div class="row" style="margin-top:var(--s3)"><button class="btn" id="chk">Prüfen</button><button class="btn ghost" id="hint">Tipp: Abhängigkeiten</button><button class="btn ghost" id="sol">Lösung zeigen</button><button class="btn ghost" id="clr">Leeren</button></div>
      <div id="res"></div></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="prev" ${i?'':'disabled'}>← Vorherige</button><button class="btn" id="next" ${i<NF_TASKS.length-1?'':'disabled'}>Nächste →</button></div>`;
  nfTaskNav(el, 'split', i, j => { nfl.si = j; nfSplit(el, v); });
  el.querySelectorAll('.cellbtn').forEach(b => b.onclick = () => { const r = +b.dataset.r, c = +b.dataset.c; G[r][c] = (G[r][c]+1) % 3; nfSplit(el, v); });
  const res = $('#res');
  $('#hint').onclick = () => { res.innerHTML = `<h4>Abhängigkeiten</h4>${depArrows(t)}<p class="muted">Jede Abhängigkeit, die nicht «voll» ist, wird zu einer eigenen Tabelle: Das Attribut links wird dort PK.</p>`; };
  $('#clr').onclick = () => { nfl.split = null; nfSplit(el, v); };
  $('#sol').onclick = () => { res.innerHTML = `<h4>Lösung (3NF)</h4>${targetHtml(t.target)}<p class="muted">Unterstrichen = PK, FK = Fremdschlüssel auf eine andere Tabelle.</p>`; };
  $('#chk').onclick = () => {
    const user = Array.from({length:k}, (_,c) => ({a:attrs.filter((_,r) => G[r][c]), pk:attrs.filter((_,r) => G[r][c]===2)}));
    const key = tb => [...tb.a].sort().join('|') + '#' + [...tb.pk].sort().join('|');
    const solKeys = t.target.map(key), left = [...solKeys];
    const msgs = []; let good = 0;
    user.forEach((u,c) => {
      if(!u.a.length){ msgs.push(`Tabelle ${c+1}: ist leer.`); return; }
      const kk = key(u), j = left.indexOf(kk);
      if(j>=0){ left.splice(j,1); good++; const n = t.target[solKeys.indexOf(kk)].n; msgs.push(`Richtig: Tabelle ${c+1} stimmt (${n}).`); return; }
      const best = t.target.map(tb => [tb, tb.a.filter(a => u.a.includes(a)).length]).sort((x,y) => y[1]-x[1])[0][0];
      const miss = best.a.filter(a => !u.a.includes(a)), extra = u.a.filter(a => !best.a.includes(a));
      const pkOk = [...u.pk].sort().join()===[...best.pk].sort().join();
      msgs.push(`Falsch: Tabelle ${c+1} (ähnlich wie «${best.n}»): ${miss.length ? 'es fehlt '+miss.join(', ')+'. ' : ''}${extra.length ? 'gehört nicht hinein: '+extra.join(', ')+'. ' : ''}${!pkOk ? 'Der PK stimmt nicht'+(u.pk.length ? '' : ' (kein PK gesetzt)')+'.' : ''}`);
    });
    const all = good===k;
    if(all) nfSaveProg(pp => pp.split[i] = true);
    res.innerHTML = `<div class="expl"><b>${all ? 'Perfekt zerlegt!' : `${good} von ${k} Tabellen richtig.`}</b><br>${msgs.map(esc).join('<br>')}</div>${all ? `<h4>Ergebnis mit Fremdschlüsseln</h4>${targetHtml(t.target)}` : ''}`;
  };
  $('#prev').onclick = () => { nfl.si = i-1; nfl.split = null; nfSplit(el, v); };
  $('#next').onclick = () => { nfl.si = i+1; nfl.split = null; nfSplit(el, v); };
}

function nfNewQuick(){
  if(Math.random() < 0.5){
    const useTask = Math.random() < 0.6, src = useTask ? pick(NF_TASKS) : pick(NF_EX);
    const ans = useTask ? nfOfTask(src) : src.ans;
    nfl.q = {txt:`In welcher Normalform ist die Tabelle «${src.t}» höchstens?`, show:nfTable(src.cols, src.pk, src.rows),
      opts:Object.entries(NF_LABEL).map(([kk,l]) => ({h:l, ok:kk===ans})), x: useTask ? NF_REASON[ans] + depArrows(src) : src.why};
  } else {
    const t = pick(NF_TASKS), [a,d] = pick(Object.entries(t.deps)), m = depMain(d), ty = depType(m);
    nfl.q = {txt:`Tabelle «${t.t}»: Welche Art von Abhängigkeit hat das Attribut «${a}»?`, show:nfTable(t.cols, t.pk, t.rows),
      opts:['full','part','trans','multi'].map(x => ({h:{full:'voll (ganzer PK)', part:'teilweise (Teil des PK)', trans:'transitiv (über Nichtschlüssel)', multi:'nicht atomar'}[x], ok:depAcc(d).some(dd => depType(dd)===x)})),
      x:`${esc(a)}: ${esc(depLabel(m,t))}`};
  }
  nfl.qp = null;
}
function nfQuick(el, v){
  if(!nfl.q) nfNewQuick();
  const q = nfl.q, ans = nfl.qp!==null;
  el.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><span class="meta muted" style="font-size:var(--t-xs);text-transform:uppercase;font-family:var(--f-ui);font-weight:600">Schnell-Check · endlos neue Fragen</span>
      <span class="stats">Richtig: <b>${nfl.qr} / ${nfl.qt}</b> · Serie: <b>${nfl.qs}</b> · Beste Serie: <b>${store.get('nfqBest',0)}</b></span></div>
    <p class="qtext">${esc(q.txt)}</p>${q.show}

function chTheory(){
  const lab = (id, txt) => `<div class="row" style="margin-top:var(--s2)"><button class="btn ghost" data-lab="${id}">Im Labor ausprobieren: ${txt}</button></div>`;
  return [
  {t:'Hinweis', h:`<p>Diese Zusammenfassung folgt deinem <b>Skript S. 25–51</b> (Ch. Rupf) und den Lernzielen. Laut Lernzielen gehören auch alle Aufgaben auf diesen Seiten zum Prüfungsstoff: Du findest sie unter <b>Übungen</b>. Das Skript enthält keine Lösungen, die Musterlösungen sind von mir erstellt.</p><p class="muted">Hilfsmittel an der Prüfung: Periodensystem (von der Lehrperson) und Taschenrechner.</p>`},
  {t:'4.1 Atommodelle im Überblick (S. 25)', h:`<div class="tablewrap"><table><tr><th>Modell</th><th>Aussage</th><th>Stärke</th><th>Schwäche</th></tr>
    <tr><td><b>Atomhypothese</b><br>Demokrit, ca. 460 v. Chr.</td><td>Kleinste, unteilbare Grundbausteine (griech. atomos = unteilbar), dazwischen leerer Raum</td><td>Erste Vorstellung von kleinsten Teilchen</td><td>Reine Überlegung, ohne Experimente</td></tr>
    <tr><td><b>Kugelteilchen</b><br>Dalton, 1808</td><td>Nicht teilbare Atome; Atome eines Elements haben gleiche Grösse und Masse; bei Reaktionen werden Atome getrennt und neu verbunden, weder erzeugt noch vernichtet</td><td>Erklärt Massenerhaltung und feste Anzahlverhältnisse</td><td>Keine Ladungen, kein Innenleben</td></tr>
    <tr><td><b>Rosinenkuchen</b><br>Thomson, 1897</td><td>Homogen positive Grundmasse, darin unregelmässig verteilt die negativen Elektronen; das Atom ist neutral</td><td>Erklärt Reibungselektrizität und Ionen</td><td>Kein Kern, erklärt den Streuversuch nicht</td></tr>
    <tr><td><b>Kern-Hülle</b><br>Rutherford, 1913</td><td>Kern in der Mitte: über 99.9 % der Masse, positiv. Hülle: fast masselos, negativ, rund 100 000-mal grösser als der Kern</td><td>Erklärt den Streuversuch</td><td>Keine Neutronen, kein Aufbau der Hülle</td></tr>
    <tr><td><b>Elementarteilchen</b><br>Neutronen 1932 entdeckt</td><td>Kern aus Protonen und Neutronen, Elektronen in der Hülle</td><td>Erklärt Isotope, Massen- und Ordnungszahl</td><td>Sagt nichts über den Aufbau der Hülle</td></tr>
    <tr><td><b>Schalenmodell</b><br>Bohr, 1913</td><td>Elektronen in konzentrischen Kugelschalen (Energieniveaus)</td><td>Erklärt Valenzelektronen und Ionisierungsenergien</td><td>Erklärt die räumliche Anordnung der Valenzelektronen nicht (dafür Kugelwolkenmodell)</td></tr></table></div>${lab('models','Atommodelle')}`},
  {t:'4.2 Streuversuch von Rutherford (S. 26–27)', h:`${rfSchema(RF_LABELS)}<p>1911 bestrahlte Rutherford eine 0.0005 mm dünne Goldfolie (rund 1000 Atomschichten) mit α-Teilchen (2 Protonen + 2 Neutronen, Ladung 2+). Die Quelle war ein Radiumpräparat in der Bohrung eines Bleiblocks. Auf dem Zinksulfidschirm verursachen auftreffende α-Teilchen Lichtblitze, die er durch ein Mikroskop beobachtete.</p>
    <p><b>Erwartung:</b> Gemäss dem Atommodell von Dalton sollten die α-Teilchen an den Gold-Atomen abprallen wie Tennisbälle an einer Wand.</p>
    <table><tr><th>Beobachtung</th><th>Schlussfolgerung</th></tr><tr><td>Fast alle fliegen ungehindert durch</td><td>Das Atom ist grösstenteils leerer Raum</td></tr><tr><td>Einige werden abgelenkt</td><td>Es gibt einen positiven Bereich, der die positiven α-Teilchen abstösst</td></tr><tr><td>Sehr wenige werden zurückgeworfen</td><td>Fast die ganze Masse sitzt in einem winzigen Kern</td></tr></table>${lab('rutherford','Streuversuch')}`},
  {t:'4.3–4.4 Elementarteilchen und Aufbau der Atome (S. 27–29)', h:`<table><tr><th>Teilchen</th><th>Bereich</th><th>Symbol</th><th>Masse</th><th>Ladung</th></tr>
    <tr><td><b>Proton</b></td><td>Kern</td><td>p⁺</td><td>≈ 1 u</td><td>+1</td></tr><tr><td><b>Neutron</b></td><td>Kern</td><td>n</td><td>≈ 1 u</td><td>0</td></tr><tr><td><b>Elektron</b></td><td>Hülle</td><td>e⁻</td><td>≈ 0.0005 u</td><td>−1</td></tr></table>
    <p class="muted" style="font-size:var(--t-xs);font-family:var(--f-ui)">1 u = 1.661 · 10⁻²⁴ g. Die Ladung des Elektrons ist die kleinste Ladung: 1 e = 1.602 · 10⁻¹⁹ Coulomb.</p>
    <div class="formelbox"><div>Ordnungszahl (Kernladungszahl) = Protonenzahl = Elektronenzahl im Atom</div><div>Massenzahl (Nukleonenzahl) = Protonen + Neutronen</div><div>Neutronenzahl = Massenzahl − Ordnungszahl</div></div>
    <p>${nuc(35,17,'Cl')} oben die Massenzahl, unten die Ordnungszahl. Beispiele:</p><ul><li>${nuc(35,17,'Cl')}: 17 p, 18 n, 17 e</li><li>${nuc(24,12,'Mg','2+')}: 12 p, 12 n, 10 e</li><li>${nuc(32,16,'S','2−')}: 16 p, 16 n, 18 e</li></ul>
    <p><b>Warum neutral?</b> Ein Atom hat gleich viele Protonen wie Elektronen. Die Ladungen heben sich auf, Neutronen sind ungeladen. <b>Nukleonen</b> sind die Kernteilchen, also Protonen und Neutronen.</p>${lab('atom','Atom-Baukasten')}`},
  {t:'4.4.1 Erklärbare Phänomene (S. 30)', h:`<ul><li><b>Reibungselektrizität:</b> Reibt man eine Kunststoff-Folie mit Papier, gehen Elektronen vom Papier auf die Folie über. Die Folie hat einen Elektronen-Überschuss (negativ), das Papier einen Mangel (positiv). Sie ziehen sich an und entladen sich bei Berührung wieder. Zwei gleich geriebene Folien stossen sich ab.</li>
    <li><b>Ionen-Bildung:</b> Atome nehmen dauerhaft Elektronen auf (negative Ionen) oder geben welche ab (positive Ionen).</li><li><b>Isotope:</b> Atome desselben Elements mit verschiedener Neutronenzahl, darum sind die Atommassen meist keine ganzen Zahlen.</li></ul><p class="muted">Diese Phänomene lassen sich mit Elementarteilchen erklären, mit dem Modell von Dalton noch nicht.</p>`},
  {t:'Isotope, Nuklide, Atommasse (S. 30–32)', h:`<ul><li><b>Nuklid:</b> Atom mit einer bestimmten Protonen- und Neutronenzahl.</li><li><b>Isotope:</b> Nuklide mit gleicher Protonenzahl (also gleiches Element), aber verschiedener Neutronenzahl. Schreibweise: ${nuc(35,17,'Cl')} oder Cl-35. Im chemischen Verhalten unterscheiden sie sich nicht.</li>
    <li><b>Mischelement:</b> Gemisch aus mehreren Isotopen (die meisten Elemente). <b>Reinelement:</b> nur ein stabiles Isotop (20 Elemente, z. B. Be, F, Na, Al, P, As, I, Cs).</li></ul>
    <table><tr><th>Wasserstoff</th><th>p⁺</th><th>n</th><th>Kurz</th><th>Häufigkeit</th></tr><tr><td>Protium (normal)</td><td>1</td><td>0</td><td>H-1</td><td>99.985 %</td></tr><tr><td>Deuterium (schwer)</td><td>1</td><td>1</td><td>H-2</td><td>0.015 %</td></tr><tr><td>Tritium (radioaktiv)</td><td>1</td><td>2</td><td>H-3</td><td>Spuren</td></tr></table>
    <h4>Durchschnittliche Atommasse</h4><div class="formelbox">Summe aus (Isotopenmasse · Häufigkeit in Prozent / 100)</div><p>Chlor: ${isoCalc(ISO[0])}</p>
    <p><b>Widerspruch zum PSE-Wert:</b> Das PSE nennt bei Mischelementen den Mittelwert aller Isotope, gewichtet nach ihrem natürlichen Anteil. Ein einzelnes Atom hat die Masse seines Isotops. So ist auch erklärbar, dass Iod (126.90 u) trotz grösserer Ordnungszahl leichter ist als Tellur (127.60 u): Tellur hat viele schwere Isotope.</p>${lab('isotope','Isotopen-Waage')}`},
  {t:'4.5 Ionisierungsenergie und Schalenmodell (S. 33–34)', h:`<p><b>Ionisierungsenergie (IE):</b> Energie, die nötig ist, um ein Elektron vollständig aus der Atomhülle zu entfernen. Das Teilchen wird dabei zu einem positiven Ion.</p>
    <table><tr><th>Natrium</th><td>1. IE</td><td>2. IE</td><td>3. IE</td><td>…</td><td>9. IE</td><td>10. IE</td><td>11. IE</td></tr><tr><th>MJ/mol</th><td>0.49</td><td>4.50</td><td>6.90</td><td>…</td><td>28.90</td><td>141.40</td><td>159.10</td></tr></table>
    <ul><li><b>Säulen werden immer höher:</b> Mit jedem entfernten Elektron wird das Ion positiver und zieht die übrigen stärker an.</li><li><b>Innerhalb einer Elektronen-Gruppe:</b> Die Kernladung bleibt gleich, aber es sind weniger Elektronen da, die sich gegenseitig abstossen.</li><li><b>Zwei grosse Sprünge bei Natrium</b> (Faktor 10 und Faktor 5): Die Elektronen sind in drei Gruppen angeordnet: 1 aussen, 8 in der Mitte, 2 innen. Innere Elektronen sind näher am Kern und stärker angezogen.</li></ul>
    <p><b>Bohr, 1913:</b> Die Elektronen ordnen sich in konzentrischen Kugelschalen (Energieniveaus) an, von innen nach aussen K, L, M, N, O, P, Q.</p>${lab('ion','Ionisierungsenergie')}`},
  {t:'4.5.2–4.5.4 Schalen und Periodensystem (S. 35–38)', h:`<table><tr><th>Schale</th><th>K</th><th>L</th><th>M</th><th>N</th></tr><tr><th>n</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>Maximal Z = 2n²</th><td>2</td><td>8</td><td>18</td><td>32</td></tr></table>
    <ul><li><b>Prinzip des Energieminimums:</b> Die Elektronen besetzen zuerst die Schale nahe am Kern.</li><li><b>Elektronenkonfiguration:</b> Mg: K2 L8 M2 · K: K2 L8 M8 N1 · Br: K2 L8 M18 N7</li><li><b>Valenzelektronen (VE):</b> Elektronen der äussersten Schale (Valenzschale), höchstens 8. Sie bestimmen das chemische Verhalten.</li><li><b>Periode</b> (waagrechte Zeile): gleiche Anzahl besetzter Schalen. <b>Gruppe</b> (senkrechte Spalte): gleiche Anzahl Valenzelektronen.</li>
    <li><b>Zeichnen:</b> In den ersten drei Perioden von innen nach aussen maximal auffüllen. Ab Periode 4: Zuerst die Valenzelektronen aus der Gruppe setzen, dann von innen auffüllen. Die zweitäusserste Schale hat 8 oder 18 Elektronen.</li><li><b>Nebengruppen:</b> Meist 2 Elektronen aussen, sie füllen innere Schalen auf. Bsp. Sc: K2 L8 M9 N2.</li></ul>
    <p><b>Darstellung mit Kreis-Segmenten:</b> Vereinfacht werden die Schalen nur als Bögen gezeichnet, oben der Buchstabe, unten die Elektronenzahl.</p>${lab('atom','Atom-Baukasten')}`},
  {t:'4.6–4.7 Kugelwolkenmodell und Punkt-Strich-Schreibweise (S. 38–39)', h:`<p><b>Kugelwolkenmodell:</b> Die Valenzelektronen verteilen sich auf vier Kugelwolken mit Platz für je zwei Elektronen. Die Wolken halten den grösstmöglichen Abstand und zeigen in die Ecken eines Tetraeders. Zuerst wird jede Wolke einfach besetzt, ab fünf Elektronen doppelt. Ausnahme: H und He haben nur eine Wolke.</p>
    <p><b>Punkt-Strich-Schreibweise:</b> Das Elementsymbol steht für den <b>Atomrumpf</b> (Atom ohne Valenzelektronen). Punkt = einzelnes Valenzelektron, bis zu vier im Uhrzeigersinn um das Symbol. Ab dem fünften Elektron entstehen Punktepaare, geschrieben als Strich.</p>
    <p>Beispiele: C hat 4 Punkte, N 1 Strich und 3 Punkte, O 2 Striche und 2 Punkte, Cl 3 Striche und 1 Punkt.</p>
    <p><b>Zusammensetzung des Atomrumpfs:</b> Chlor-35: 17 p⁺, 18 n, 10 e⁻ (die 7 Valenzelektronen fehlen). Kalium-39: 19 p⁺, 20 n, 18 e⁻.</p>`},
  {t:'4.8.1 Entdeckung der Radioaktivität (S. 40)', h:`<ul><li><b>Kernkraft:</b> Die Protonen stossen sich elektrostatisch ab. Eine viel stärkere Kraft, die Kernkraft, hält den Kern zusammen. Bei sehr schweren Kernen (Uran, Radium) reicht sie nicht aus: Sie zerfallen spontan. Solche instabilen Nuklide heissen <b>Radionuklide</b>.</li>
    <li><b>1896 Becquerel:</b> Uranmineralien senden unsichtbare Strahlen aus.</li><li><b>1898 Marie und Pierre Curie:</b> entdecken Radium und Polonium und prägen den Begriff <b>Radioaktivität</b>. Nobelpreis 1903 (Physik, mit Becquerel), Marie Curie zusätzlich 1911 (Chemie).</li><li><b>1903 Rutherford:</b> Im elektrischen Feld zeigen sich drei Strahlenarten: α, β und γ.</li></ul>${lab('radiation','Strahlungsarten')}`},
  {t:'4.8.2 Natürlicher radioaktiver Zerfall (S. 41–42)', h:`<div class="tablewrap"><table><tr><th></th><th>α-Strahlung</th><th>β-Strahlung</th><th>γ-Strahlung</th></tr>
    <tr><th>Typischer Kern</th><td>sehr schwere Kerne</td><td>Kerne mit Neutronenüberschuss</td><td>angeregte Kerne mit Energieüberschuss; häufige Begleitstrahlung bei α und β</td></tr>
    <tr><th>Vorgang</th><td>He-Kern (2 n + 2 p⁺) wird herausgeschleudert, der Restkern hat 2 p und 2 n weniger</td><td>Neutron zerfällt in ein Proton (bleibt im Kern) und ein schnelles Elektron (verlässt den Kern)</td><td>Sehr energiereiche elektromagnetische Strahlung von sehr kurzer Wellenlänge</td></tr>
    <tr><th>Beispiel</th><td>${nuc(238,92,'U')} → ${nuc(234,90,'Th')} + ${P_ALPHA()}</td><td>${nuc(10,4,'Be')} → ${nuc(10,5,'B')} + e⁻</td><td>${nuc(133,56,'Ba')} → ${nuc(133,56,'Ba')} + γ</td></tr>
    <tr><th>Allgemein</th><td>NZ −4, OZ −2</td><td>NZ gleich, OZ +1</td><td>keine Änderung von NZ und OZ</td></tr>
    <tr><th>Geschwindigkeit</th><td>6 % Lichtgeschw.</td><td>96 % Lichtgeschw.</td><td>100 % Lichtgeschw.</td></tr>
    <tr><th>Reichweite Luft</th><td>einige Zentimeter</td><td>Meter</td><td>Hunderte von Metern</td></tr><tr><th>Reichweite Körper</th><td>Bruchteile eines mm</td><td>Millimeter</td><td>bis etwa 1 Meter</td></tr>
    <tr><th>Schutz</th><td>Papier, Kleidung</td><td>4 mm Aluminium, Kunststoff, Kleidung</td><td>dickes, schweres Material: Blei, Beton, Erde</td></tr></table></div>
    <p class="muted" style="font-size:var(--t-xs);margin-top:var(--s2);font-family:var(--f-ui)">NZ = Nukleonenzahl, OZ = Ordnungszahl. Reichweiten und Schutz aus den Zusatzinformationen. Kernchemische Gleichungen schreibt man ohne Ladungsangaben.</p>
    <p><b>Wirkung:</b> Radioaktive Strahlung ist sehr energiereich und schädigt lebende Zellen. Bei gleicher Energie wirkt α-Strahlung 20-mal stärker als β und γ, vor allem im Körper. Mutationen können zum Zelltod, zu Krebs oder zu Schäden bei den Nachkommen führen.</p>
    <p><b>Warum sendet ein Kern Elektronen aus, obwohl er keine enthält?</b> Das Elektron entsteht erst beim Zerfall eines Neutrons.</p><div class="row"><button class="btn ghost" data-lab="radiation">Im Labor: Strahlungsarten</button><button class="btn ghost" data-lab="decay">Im Labor: Zerfälle</button></div>`},
  {t:'4.8.3–4.8.4 Zerfallsreihen und Halbwertszeit (S. 42–44)', h:`<p><b>Zerfallsreihe:</b> Das Produkt ist oft selber instabil und zerfällt weiter, bis ein stabiles Isotop entsteht. Drei natürliche Reihen sind bekannt. Uran-Radium-Reihe: U-238 → Th-234 → Pa-234 → U-234 → Th-230 → Ra-226 → Rn-222 → Po-218 → Pb-214 → Bi-214 → Po-214 → Pb-210 → Bi-210 → Po-210 → Pb-206.</p>
    <p><b>Halbwertszeit (HWZ):</b> Zeit, in der die Hälfte der ursprünglich vorhandenen Kerne zerfallen ist. Sie ist für jedes Radionuklid charakteristisch und lässt sich nicht beeinflussen. Je länger sie ist, desto stabiler sind die Kerne. Wann ein einzelner Kern zerfällt, ist Zufall.</p>
    <div class="formelbox"><div>% unzerfallene Radionuklide = N(t) / N(0) · 100 %</div><div>Rest = Start · (1/2)<sup>n</sup> &nbsp; mit n = Zeit / HWZ</div></div>
    <table><tr><th>Halbwertszeiten</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>Rest in %</th><td>50</td><td>25</td><td>12.5</td><td>6.25</td><td>3.125</td></tr></table>
    <h4>Halbwertszeiten aus dem Skript</h4><div class="tablewrap"><table><tr><th>Element</th><th>Symbol</th><th>HWZ</th><th>Strahlung</th></tr>${HWZ_TABLE.map(r => `<tr><td>${r[0]}</td><td>${nuc(r[1],r[2],CH_SYM[r[2]-1])}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table></div>${lab('half','Halbwertszeit')}`},
  {t:'4.8.5 Kernspaltung und Kettenreaktion (S. 45–46)', h:`${fissionSchema(FI_LABELS)}<p class="eq">${nuc(235,92,'U')} + ${P_N()} → ${nuc(144,56,'Ba')} + ${nuc(89,36,'Kr')} + 3 ${P_N()} + E</p>
    <p class="muted" style="font-size:var(--t-xs);font-family:var(--f-ui)">Das Bild im Skript nennt den Zwischenkern «instabiler Uran 235-Kern». Mit dem aufgenommenen Neutron ist es rechnerisch U-236.</p>
    <ul><li><b>Entdeckung:</b> 1938 beschossen Hahn und Strassmann U-235 mit langsamen Neutronen und fanden Barium und Krypton. Lise Meitner nannte den Vorgang Kernspaltung.</li><li><b>Ablauf:</b> Durch Aufnahme des Neutrons entsteht ein instabiler Kern. Er zerfällt in Bruchteilen einer Sekunde in zwei ungefähr gleich schwere Spaltprodukte, die wegen der Protonen-Abstossung auseinanderfliegen, und drei schnelle Neutronen. Etwa 200 verschiedene Spaltprodukte sind möglich, sie sind fast immer radioaktiv.</li>
    <li><b>Kettenreaktion:</b> Nach einer Abbremsung spalten die freien Neutronen weitere Urankerne.</li><li><b>Energie:</b> Ausgangskern plus Neutron haben mehr Masse als die entstehenden Kerne und Neutronen. Dieser <b>Massendefekt</b> wird nach E = m·c² zu Energie (γ-Strahlung und Wärme). 1 g Uran liefert etwa 100 Millionen kJ, 1 g Steinkohle nur 29 kJ.</li>
    <li><b>Atombombe:</b> Die Energie wird in Sekundenbruchteilen frei. <b>Kernkraftwerk:</b> kontrollierte Kettenreaktion, höchstens ein frei werdendes Neutron spaltet einen weiteren Kern.</li></ul>${lab('chain','Kettenreaktion')}`},
  {t:'4.8.6 Kernkraftwerk (S. 47–48)', h:`<ul><li><b>Wärmekraftwerk:</b> Wärme aus der Kernspaltung verdampft Wasser, der Dampf treibt Turbine und Generator an.</li><li><b>Druckwasserreaktor:</b> Das Wasser im Primärkreislauf wird etwa 350 °C heiss und steht unter hohem Druck, damit es trotzdem nicht siedet. Es ist radioaktiv und bleibt im Reaktorgebäude. Im Wärmetauscher gibt es die Wärme an den Sekundärkreislauf ab; dessen Wasser verdampft.</li>
    <li><b>Brennstoff:</b> Natururan hat 99.3 % U-238 und nur 0.7 % U-235, darum wird es auf etwa 3 % angereichert.</li><li><b>Wasser</b> bremst die schnellen Neutronen ab und transportiert die Wärme.</li><li><b>Steuerung:</b> Nur eines der 2–3 Spaltneutronen darf die nächste Spaltung auslösen. Die übrigen fängt Bor im Kühlwasser (als Borsäure) ein.</li><li><b>Abschalten:</b> Die Regelstäbe aus Cadmium oder Bor werden ganz eingefahren. Sie fangen fast alle Neutronen ein, die Kettenreaktion stirbt ab.</li></ul>`},
  {t:'4.8.7 Kernfusion (S. 49–50)', h:`<p><b>Kernfusion:</b> Zwei leichte Kerne verschmelzen zu einem neuen Kern. Dabei wird sehr viel Energie frei, sie ist die Energiequelle der Sonne und der anderen Sterne.</p><p class="eq">${nuc(2,1,'D')} + ${nuc(3,1,'T')} → ${nuc(4,2,'He')} + ${P_N()} + Energie</p>
    <ul><li><b>Warum so schwierig?</b> Beide Kerne sind positiv und stossen sich ab. Erst bei rund 100 000 000 °C sind sie schnell genug. Der Stoff liegt dann als Plasma vor (Elektronen und völlig ionisierte Kerne).</li><li><b>Fusionsreaktoren:</b> Kein Behälter hält dieser Temperatur stand, und schnelle Neutronen reagieren mit den Wänden. Darum kann die Fusion in nächster Zeit nicht zur Energieversorgung beitragen.</li></ul>
    <h4>In der Sonne (vereinfacht)</h4><ol><li>Zwei H-1-Kerne verschmelzen zu einem H-2-Kern, Energie wird frei.</li><li>Ein H-2-Kern und ein H-1-Kern verschmelzen zu einem He-3-Kern, Energie wird frei.</li><li>Zwei He-3-Kerne verschmelzen zu einem He-4-Kern, zwei H-1-Kerne werden frei, Energie wird frei.</li></ol>`},
  {t:'4.8.8 Mittlere Strahlenbelastung (S. 51)', h:`<table class="kv">${STRAHLEN.map(r => `<tr><td>${esc(r[0])}</td><td style="white-space:nowrap">${r[1]} mSv</td></tr>`).join('')}<tr><th>Total</th><th>4.2 mSv</th></tr></table><p>Den grössten Anteil hat Radon in Wohnräumen. Radon ist ein Edelgas, kein Metall.</p>`}
  ];
}

  {id:'c18', title:'Erklären in eigenen Worten', page:'Lernziele', type:'reveal',
   prompts:['Warum sind Atome elektrisch neutral, obwohl sie geladene Teilchen enthalten?','Was passiert bei der Reibungselektrizität, und welches Modell macht sie verständlich?','Warum unterscheidet sich die Masse eines einzelnen Atoms vom PSE-Wert?','Warum gibt es innerhalb eines Atoms unterschiedliche Ionisierungsenergien?','Warum sind gewisse Atomkerne instabil?','Warum setzt die Kernspaltung so viel Energie frei?'],
   sol:`<b>Neutral:</b> Gleich viele Protonen (+) wie Elektronen (−), die Ladungen heben sich auf. Neutronen sind ungeladen.<br><br>
   <b>Reibungselektrizität:</b> Beim Reiben wechseln Elektronen von einem Körper zum anderen; einer wird negativ, der andere positiv. Verständlich mit den Elementarteilchen, also dem Elementarteilchen-Modell: Elektronen in der Hülle können übergehen. Mit dem Modell von Dalton ging das noch nicht.<br><br>
   <b>PSE-Wert:</b> Er ist der nach Häufigkeit gewichtete Mittelwert aller natürlichen Isotope. Ein einzelnes Atom hat die Masse seines Isotops.<br><br>
   <b>Ionisierungsenergien:</b> Mit jedem entfernten Elektron wird das Ion positiver und hält die übrigen stärker fest. Einen grossen Sprung gibt es, sobald das nächste Elektron aus einer inneren Schale kommt: näher am Kern, stärker angezogen.<br><br>
   <b>Instabile Kerne:</b> Die Protonen stossen sich elektrostatisch ab, die Kernkraft hält den Kern zusammen. Bei sehr schweren Kernen wie Uran oder Radium reicht sie dauerhaft nicht aus, und auch Kerne mit Neutronenüberschuss sind instabil. Sie zerfallen spontan.<br><br>
   <b>Energie der Kernspaltung:</b> Die Produkte haben zusammen weniger Masse als die Ausgangsteilchen. Dieser Massendefekt wird nach E = m·c² zu Energie.`}
];

   sol:`<b>Erwartung:</b> Gemäss dem Atommodell von Dalton sollten die α-Teilchen auf die Gold-Atome treffen und daran abprallen, wie Tennisbälle an einer Wand.<br><br><b>Ergebnisse:</b> Fast alle α-Teilchen fliegen ungehindert durch die Folie. Einige werden abgelenkt, sehr wenige zurückgeworfen.<br><br><b>Schlussfolgerungen:</b> Das Atom ist grösstenteils leerer Raum. Im Zentrum sitzt ein winziger, positiv geladener Kern mit fast der ganzen Masse. Die negativen Elektronen befinden sich in der fast masselosen Hülle.<br><br><b>Skizze:</b> Mehrere Reihen von Atomen als grosse Kreise (Hülle) mit einem winzigen Punkt in der Mitte (Kern). Die meisten Bahnen gehen gerade zwischen den Kernen durch. Bahnen nahe an einem Kern werden abgelenkt, eine Bahn direkt auf einen Kern kehrt um. Beschriften: Kern, Hülle, α-Teilchen.`},

  {id:'s33', head:'Skript S. 33–39: Aufbau der Atomhülle', title:'S. 33–34: Ionisierungsenergien von Natrium', page:'S. 33–34', type:'reveal', prompts:['a) Weshalb werden die Säulen im Diagramm von links nach rechts immer höher?','b) Zweimal steigt die Ionisierungsenergie sprunghaft (Faktor 5 und Faktor 10). Wie müssen die Elektronen angeordnet sein?','c) Weshalb nehmen die Ionisierungsenergien innerhalb einer Elektronen-Gruppe zu?','d–f) Wie sind die Elektronen des Natrium-Atoms verteilt? Wie lautet die Elektronenkonfiguration?'],
   sol:`<b>a)</b> Mit jedem entfernten Elektron wird das Teilchen positiver. Die übrigen Elektronen werden stärker angezogen, es braucht mehr Energie.<br><br><b>b)</b> In drei Gruppen: 1 Elektron aussen (grosser Sprung danach), 8 Elektronen in der Mitte, 2 Elektronen innen. Die inneren sind näher am Kern und werden viel stärker angezogen.<br><br><b>c)</b> Der Kern zieht mit gleicher Ladung an, aber es sind weniger Elektronen da, die sich gegenseitig abstossen. Das nächste Elektron wird darum stärker festgehalten.<br><br><b>d–f)</b> K-Schale 2, L-Schale 8, M-Schale 1. Elektronenkonfiguration: <b>K2 L8 M1</b>. Im Baukasten kannst du das als Schalenmodell und mit Kreis-Segmenten ansehen.`},

  {id:'s43b', title:'S. 43: Warum ist das so?', page:'S. 43', type:'reveal', prompts:['Aufgabe 2: Warum kann ein Cs-137-Kern Elektronen aussenden, obwohl Kerne doch gar keine Elektronen enthalten?','Aufgabe 4: Warum verändert sich ein Kern beim Aussenden von γ-Strahlung nicht?'],

}

/* ---------- Karteikarten ---------- */
function viewCards(v, s){
  const own = store.get('cards.'+s.id,[]);
  const base = s.id==='bw' ? BW.cards : s.id==='bm' ? MATH.cards : s.id==='m162' ? M162.cards : s.id==='bn' ? BN.cards : [];
  const all = base.concat(own);
  const known = store.get('known.'+s.id,{});
  let queue = all.map((c,i) => i).filter(i => !known[all[i][0]]);
  let idx = 0, flipped = false;
  v.innerHTML = `
    <div class="card"><h3>Lernen</h3><p class="muted" id="cstat"></p><div class="flash" id="flash"></div>
      <div class="row" style="margin-top:var(--s3);justify-content:center">
        <button class="btn ghost" id="again">Nochmal</button><button class="btn" id="knew">Gewusst</button>
        <button class="btn ghost" id="reset">Alle zurücksetzen</button></div></div>
    <div class="card"><h3>Eigene Karte hinzufügen</h3>
      <div class="grid2"><input type="text" id="front" placeholder="Vorderseite (Frage / Begriff)"><input type="text" id="back" placeholder="Rückseite (Antwort)"></div>
      <div class="row" style="margin-top:var(--s2)"><button class="btn" id="add">Hinzufügen</button></div>
      ${own.length?`<h4>Deine Karten (${own.length})</h4><ul>${own.map((c,i) => `<li>${esc(c[0])} → ${esc(c[1])} <button class="chip" data-del="${i}">löschen</button></li>`).join('')}</ul>`:''}</div>`;
  function show(){
    $('#cstat').textContent = `${all.length-queue.length} von ${all.length} Karten gewusst`;
    const f = $('#flash');
    if(!all.length){ f.innerHTML = 'Noch keine Karten. Füge unten deine erste hinzu.'; return; }
    if(!queue.length){ f.innerHTML = 'Alles gewusst!<small>«Alle zurücksetzen» für eine neue Runde</small>'; return; }
    const c = all[queue[idx % queue.length]];
    f.innerHTML = flipped ? `${esc(c[1])}<small>Antwort</small>` : `${esc(c[0])}<small>Klicken zum Umdrehen</small>`;
  }
  $('#flash').onclick = () => { flipped=!flipped; show(); };
  $('#again').onclick = () => { if(queue.length){ idx=(idx+1)%queue.length; flipped=false; show(); } };
  $('#knew').onclick = () => { if(!queue.length) return; const i=queue[idx%queue.length]; known[all[i][0]]=1; store.set('known.'+s.id,known); queue=queue.filter(x => x!==i); idx = queue.length ? idx%queue.length : 0; flipped=false; show(); renderSide(); };
  $('#reset').onclick = () => { store.set('known.'+s.id,{}); viewCards(v,s); };
  $('#add').onclick = () => { const a=$('#front').value.trim(), b=$('#back').value.trim(); if(!a||!b) return; own.push([a,b]); store.set('cards.'+s.id,own); viewCards(v,s); renderSide(); };
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { own.splice(+b.dataset.del,1); store.set('cards.'+s.id,own); viewCards(v,s); renderSide(); });
  show();
}

/* ---------- Formel-Trainer ---------- */
const FORMULAS = [
  {name:'Gewinn', parts:['Ertrag','−','Aufwand'], tip:'Was reinkommt minus was draufgeht.', unit:'CHF'},
  {name:'Wirtschaftlichkeit', parts:['Ertrag','÷','Aufwand'], tip:'Über 1 = Gewinn, genau 1 = ausgeglichen, unter 1 = Verlust.', unit:'Zahl ohne Einheit'},
  {name:'Rentabilität', parts:['Gewinn','÷','Kapital','× 100'], tip:'Wie viel Prozent «verdient» das eingesetzte Kapital?', unit:'%'},
  {name:'Produktivität', parts:['Output','÷','Input'], tip:'Nur Mengen, kein Geld! z. B. Stück pro Mitarbeitende/n.', unit:'Menge pro Einheit'},
  {name:'Ertrag', parts:['Menge','×','Verkaufspreis'], tip:'Alle verkauften Stück mal Preis.', unit:'CHF'},
  {name:'Aufwand', parts:['Menge','×','Kosten pro Stück'], tip:'Alle Stück mal das, was eines kostet.', unit:'CHF'},
  {name:'Nutzwert', parts:['Punkte','×','Gewichtung'], tip:'Für die Nutzwertanalyse, danach pro Variante addieren.', unit:'Punkte'}
];
const OPS = ['−','÷','×','× 100'];
const TERMS = [...new Set(FORMULAS.flatMap(f => f.parts.filter(p => !OPS.includes(p))))];
const ft = {mode:'sheet', hide:false, b:null, c:null, right:0, total:0, streak:0, last:null};
const fmt = n => (Math.round(n*100)/100).toLocaleString('de-CH');
const rnd = (a,b,step=1) => a + step*Math.floor(Math.random()*(Math.floor((b-a)/step)+1));
const numIn = s => parseFloat(String(s).replace(/['’\s]/g,'').replace(',','.').replace('%',''));
const TASKS = [
  () => { const A=rnd(200,900,10)*1000, E=A+rnd(-50,300,10)*1000;
    return {f:'Gewinn', q:`Ertrag CHF ${fmt(E)}, Aufwand CHF ${fmt(A)}. Wie gross ist der Gewinn?`, unit:'CHF', ans:E-A, sol:`Gewinn = Ertrag − Aufwand = ${fmt(E)} − ${fmt(A)} = <b>${fmt(E-A)}</b>${E<A?' (Verlust)':''}`}; },
  () => { const A=rnd(200,900,10)*1000, E=A+rnd(-100,400,10)*1000, w=E/A;
    return {f:'Wirtschaftlichkeit', q:`Ertrag CHF ${fmt(E)}, Aufwand CHF ${fmt(A)}. Berechne die Wirtschaftlichkeit (auf 2 Stellen gerundet).`, unit:'', ans:w, round:2, sol:`Wirtschaftlichkeit = Ertrag ÷ Aufwand = ${fmt(E)} ÷ ${fmt(A)} = <b>${fmt(w)}</b> → ${w>1?'Gewinn':w<1?'Verlust':'ausgeglichen'}`}; },
  () => { const K=rnd(2,40)*100000, G=K*rnd(5,250)/1000, r=G/K*100;
    return {f:'Rentabilität', q:`Ein Unternehmen hat CHF ${fmt(K)} Kapital eingesetzt und CHF ${fmt(G)} Gewinn erzielt. Wie hoch ist die Rentabilität?`, unit:'%', ans:r, round:1, sol:`Rentabilität = Gewinn ÷ Kapital × 100 = ${fmt(G)} ÷ ${fmt(K)} × 100 = <b>${fmt(r)} %</b>`}; },
  () => { const M=rnd(5,60), O=rnd(1000,20000,100), p=O/M;
    return {f:'Produktivität', q:`${M} Mitarbeitende stellen pro Jahr ${fmt(O)} Stück her. Wie hoch ist die Produktivität (Stück pro Mitarbeitende/n, 1 Stelle)?`, unit:'Stück', ans:p, round:1, sol:`Produktivität = Output ÷ Input = ${fmt(O)} ÷ ${M} = <b>${fmt(Math.round(p*10)/10)}</b> Stück pro Mitarbeitende/n`}; },
  () => { const m=rnd(1,20)*500, P=rnd(20,300,5), C=P-rnd(2,Math.max(3,Math.floor(P/2))), K=rnd(5,50)*100000, E=m*P, A=m*C, G=E-A, r=G/K*100;
    return {f:'Rentabilität', q:`${fmt(m)} Stück werden für je CHF ${fmt(P)} verkauft, der Aufwand pro Stück beträgt CHF ${fmt(C)}. Das Kapital beträgt CHF ${fmt(K)}. Wie hoch ist die Rentabilität?`, unit:'%', ans:r, round:1,
      sol:`1. Ertrag = ${fmt(m)} × ${fmt(P)} = ${fmt(E)}<br>2. Aufwand = ${fmt(m)} × ${fmt(C)} = ${fmt(A)}<br>3. Gewinn = ${fmt(E)} − ${fmt(A)} = ${fmt(G)}<br>4. Rentabilität = ${fmt(G)} ÷ ${fmt(K)} × 100 = <b>${fmt(Math.round(r*10)/10)} %</b>`}; },
  () => { const r=rnd(2,20), K=rnd(2,40)*100000, G=K*r/100;
    return {f:'Rentabilität', q:`Umgekehrt: Die Rentabilität beträgt ${r} %, das Kapital CHF ${fmt(K)}. Wie gross war der Gewinn?`, unit:'CHF', ans:G, sol:`Rentabilität = Gewinn ÷ Kapital × 100 → Gewinn = Kapital × Rentabilität ÷ 100 = ${fmt(K)} × ${r} ÷ 100 = <b>${fmt(G)}</b>`}; },
  () => { const w=rnd(105,160)/100, A=rnd(100,800,10)*1000, E=Math.round(w*A);
    return {f:'Wirtschaftlichkeit', q:`Umgekehrt: Die Wirtschaftlichkeit beträgt ${fmt(w)}, der Aufwand CHF ${fmt(A)}. Wie gross ist der Ertrag?`, unit:'CHF', ans:E, sol:`Wirtschaftlichkeit = Ertrag ÷ Aufwand → Ertrag = Wirtschaftlichkeit × Aufwand = ${fmt(w)} × ${fmt(A)} = <b>${fmt(E)}</b>`}; },
  () => { const p=rnd(1,5), g=rnd(1,9)*10, n=p*g/100;
    return {f:'Nutzwert', q:`Ein Kriterium ist mit ${g} % gewichtet, eine Variante erhält ${p} Punkte. Wie gross ist der Nutzwert?`, unit:'', ans:n, round:2, sol:`Nutzwert = Punkte × Gewichtung = ${p} × ${g/100} = <b>${fmt(n)}</b>`}; }
];

function viewFormeln(v){
  const m = ft.mode;
  v.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:var(--s3)">
      <button class="btn ghost" id="back">← Alle Übungen</button>
      <span class="stats">Richtig: <b>${ft.right} / ${ft.total}</b> · Serie: <b>${ft.streak}</b> · Beste Serie: <b>${store.get('ftBest',0)}</b></span></div>
    <div class="subtabs">${[['sheet','Merkblatt'],['build','Formel bauen'],['calc','Rechnen']].map(t => `<button class="chip ${m===t[0]?'on':''}" data-m="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="card ex" id="fbody"></div>`;
  $('#back').onclick = () => openEx(null);
  v.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { ft.mode=b.dataset.m; viewFormeln(v); });
  ({sheet:fSheet, build:fBuild, calc:fCalc})[m]($('#fbody'), v);
}
function fSheet(el){
  el.innerHTML = `<h3>Merkblatt Formeln</h3>
    <p class="muted">Mit «Formeln verdecken» kannst du dich selbst abfragen: Sag die Formel laut und klick dann darauf.</p>
    <div class="tablewrap"><table class="fsheet ${ft.hide?'hide':''}"><tr><th>Was?</th><th>Formel</th><th>Einheit</th><th>Merkhilfe</th></tr>
    ${FORMULAS.map(f => `<tr><td>${f.name}</td><td class="f"><span>${f.name} = ${f.parts.join(' ')}</span></td><td>${f.unit}</td><td class="muted">${f.tip}</td></tr>`).join('')}</table></div>
    <h4>Umstellen (für «umgekehrte» Aufgaben)</h4>
    <ul><li>Gewinn = Kapital × Rentabilität ÷ 100</li><li>Kapital = Gewinn ÷ Rentabilität × 100</li><li>Ertrag = Wirtschaftlichkeit × Aufwand</li><li>Aufwand = Ertrag − Gewinn</li></ul>
    <div class="row" style="margin-top:var(--s3)"><button class="btn" id="hide">${ft.hide?'Alle aufdecken':'Formeln verdecken'}</button><button class="btn ghost" id="go">Jetzt üben →</button></div>`;
  $('#hide').onclick = () => { ft.hide=!ft.hide; fSheet(el); };
  $('#go').onclick = () => { ft.mode='build'; viewFormeln($('#view')); };
  el.querySelectorAll('td.f span').forEach(s => s.onclick = () => s.classList.toggle('shown'));
}
function ftCount(ok){
  ft.total++; if(ok){ ft.right++; ft.streak++; if(ft.streak>store.get('ftBest',0)) store.set('ftBest',ft.streak); } else ft.streak=0;
  const st = document.querySelector('.stats');
  if(st) st.innerHTML = `Richtig: <b>${ft.right} / ${ft.total}</b> · Serie: <b>${ft.streak}</b> · Beste Serie: <b>${store.get('ftBest',0)}</b>`;
}
function fBuild(el){
  if(!ft.b){ let f; do { f = FORMULAS[Math.floor(Math.random()*FORMULAS.length)]; } while(FORMULAS.length>1 && f.name===ft.last); ft.last=f.name; ft.b={f, done:false}; }
  const f = ft.b.f;
  const opt = `<option value="">?</option>`+TERMS.map(t => `<option>${t}</option>`).join('');
  el.innerHTML = `<h3>Setz die Formel zusammen</h3>
    <div class="formula"><span>${f.name} =</span>${f.parts.map(p => OPS.includes(p) ? `<span>${p}</span>` : `<select data-w="${p}">${opt}</select>`).join('')}</div>
    <div class="fb" id="bfb"></div>
    <div class="row" style="margin-top:var(--s3)"><button class="btn" id="chk">Prüfen</button><button class="btn ghost" id="nx">Nächste Formel →</button></div>`;
  const sels = [...el.querySelectorAll('select')];
  $('#chk').onclick = () => {
    if(ft.b.done) return;
    if(sels.some(s => !s.value)){ $('#bfb').className='fb bad'; $('#bfb').textContent='Füll zuerst alle Felder aus.'; return; }
    let ok = true; sels.forEach(s => { const g = s.value===s.dataset.w; ok = ok && g; mark(s,g); });
    ft.b.done = true; ftCount(ok);
    $('#bfb').className = 'fb '+(ok?'ok':'bad');
    $('#bfb').innerHTML = (ok?'Richtig! ':'Falsch. Richtig ist: ')+`<b>${f.name} = ${f.parts.join(' ')}</b> · ${f.tip}`;
    $('#nx').focus();
  };
  $('#nx').onclick = () => { ft.b=null; fBuild(el); };
}
function fCalc(el){
  if(!ft.c){ let t; do { t = TASKS[Math.floor(Math.random()*TASKS.length)]; } while(TASKS.length>1 && t===ft.lastT); ft.lastT=t; ft.c={...t(), done:false, hint:false}; }
  const c = ft.c, f = FORMULAS.find(x => x.name===c.f);
  el.innerHTML = `<div class="meta">Rechenaufgabe · ${c.f}</div><p class="qtext">${c.q}</p>
    <div class="calcin"><input type="text" id="cin" inputmode="decimal" placeholder="Resultat" autocomplete="off"><span class="muted">${c.unit}</span>
      <button class="btn" id="chk">Prüfen</button><button class="btn ghost" id="hint">Formel-Tipp</button><button class="btn ghost" id="nx">Neue Aufgabe →</button></div>
    <div class="fb" id="hfb"></div><div class="expl" id="cfb" hidden></div>
    <p class="muted" style="font-size:var(--t-xs);margin:var(--s2) 0 0;font-family:var(--f-ui)">Enter = prüfen bzw. nächste Aufgabe. Komma, Punkt und Tausender-Apostroph sind erlaubt.</p>`;
  const inp = $('#cin'); inp.focus();
  $('#hint').onclick = () => { c.hint=true; $('#hfb').className='fb'; $('#hfb').innerHTML = `Tipp: <b>${f.name} = ${f.parts.join(' ')}</b>`; };
  $('#chk').onclick = () => {
    if(c.done) return;
    const x = numIn(inp.value); if(isNaN(x)) { $('#hfb').className='fb bad'; $('#hfb').textContent='Gib eine Zahl ein.'; return; }
    const tol = c.round!==undefined ? 0.6*Math.pow(10,-c.round) : 0.5;
    const ok = Math.abs(x-c.ans) <= tol; mark(inp,ok); c.done=true; ftCount(ok);
    const cf = $('#cfb'); cf.hidden=false; cf.innerHTML = `<b>${ok?'Richtig!':'Leider falsch.'}</b><br>${c.sol}`;
    $('#nx').focus();
  };
  $('#nx').onclick = () => { ft.c=null; fCalc(el); };
  inp.onkeydown = ev => { if(ev.key==='Enter'){ ev.preventDefault(); c.done ? $('#nx').click() : $('#chk').click(); } };
}

/* ---------- Schnelltest ---------- */
function startQuiz(onlyWrong){
  const wrong = store.get(qk('quizWrong'),[]);
  let pool = quizPool();
  if(onlyWrong) pool = pool.filter(q => wrong.includes(q.q));
  quiz = {qs: shuffle(pool).slice(0,10).map(q => ({...q, opts: shuffle(q.a.map((t,k) => ({t, ok:k===0})))})), i:0, score:0, picked:null, missed:[], onlyWrong};
  exOpen='quiz'; render(); window.scrollTo(0,0);
}
function viewQuiz(v){
  if(!quiz){ exOpen=null; return viewExercises(v, SUBJECTS.find(x => x.id===cur)); }
  const n = quiz.qs.length;
  if(quiz.i>=n){
    const pct = quiz.score/n, cls = pct>=.8?'good':pct>=.5?'mid':'low';
    if(!quiz.onlyWrong && n===10){ const b=store.get(qk('quizBest'),null); if(b===null||quiz.score>b) store.set(qk('quizBest'),quiz.score); }
    const msg = pct===1?'Perfekt!':pct>=.8?'Sehr gut!':pct>=.5?'Gut, da geht noch mehr.':'Schau dir die Theorie nochmal an.';
    v.innerHTML = `<div class="card" style="text-align:center"><div class="muted">Resultat</div><div class="big">${quiz.score} / ${n}</div>
      <span class="badge ${cls}">${msg}</span>
      ${quiz.missed.length?`<div style="text-align:left;margin-top:var(--s3)"><h4>Das solltest du nochmal anschauen</h4><ul>${quiz.missed.map(q => `<li><b>${esc(q.q)}</b><br>${esc(q.a[0])} <span class="muted">· ${esc(q.x)}</span></li>`).join('')}</ul></div>`:''}
      <div class="row" style="justify-content:center;margin-top:var(--s3)"><button class="btn" id="again">Neuer Test</button>
      ${store.get(qk('quizWrong'),[]).length?'<button class="btn ghost" id="fix">Fehler üben</button>':''}<button class="btn ghost" id="back">Zur Übersicht</button></div></div>`;
    $('#again').onclick = () => startQuiz(false);
    if($('#fix')) $('#fix').onclick = () => startQuiz(true);
    $('#back').onclick = () => { quiz=null; openEx(null); };
    return;
  }
  const q = quiz.qs[quiz.i], answered = quiz.picked!==null;
  v.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:var(--s3)">
      <button class="btn ghost" id="back">← Abbrechen</button><span class="muted">Frage ${quiz.i+1} von ${n} · ${quiz.score} richtig</span></div>
    <div class="progress" style="margin-bottom:var(--s3)"><i style="width:${quiz.i/n*100}%"></i></div>
    <div class="card"><div class="meta muted" style="font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-ui);font-weight:600">${quiz.onlyWrong?'Fehler üben':'Schnelltest'}</div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k) => { let c=''; if(answered){ if(o.ok) c='ok'; else if(k===quiz.picked) c='bad'; }
        return `<button class="opt ${c}" data-k="${k}" ${answered?'disabled':''}><span class="k">${k+1}</span>${esc(o.t)}${answered&&o.ok?' (richtig)':''}${answered&&c==='bad'?' (deine Wahl)':''}</button>`; }).join('')}</div>
      ${answered?`<div class="expl"><b>${q.opts[quiz.picked].ok?'Richtig!':'Leider falsch.'}</b> ${esc(q.x)}</div>
        <div class="row" style="justify-content:flex-end;margin-top:var(--s3)"><button class="btn" id="next">${quiz.i===n-1?'Resultat anzeigen':'Weiter →'}</button></div>`
        :'<p class="muted" style="font-size:var(--t-xs);margin:var(--s2) 0 0;font-family:var(--f-ui)">Tipp: Du kannst auch mit den Tasten 1–4 antworten.</p>'}</div>`;
  $('#back').onclick = () => { quiz=null; openEx(null); };
  v.querySelectorAll('.opt').forEach(b => b.onclick = () => answerQuiz(+b.dataset.k));
  if($('#next')) { $('#next').onclick = nextQuiz; $('#next').focus(); }
}
function answerQuiz(k){
  if(!quiz || quiz.picked!==null) return;
  const q = quiz.qs[quiz.i]; quiz.picked = k;
  let wrong = store.get(qk('quizWrong'),[]);
  if(q.opts[k].ok){ quiz.score++; wrong = wrong.filter(w => w!==q.q); }
  else { quiz.missed.push(q); if(!wrong.includes(q.q)) wrong.push(q.q); }
  store.set(qk('quizWrong'),wrong); render();
}
function nextQuiz(){ quiz.i++; quiz.picked=null; render(); }
document.addEventListener('keydown', ev => {
  if(exOpen!=='quiz' || !quiz || tab!=='ex' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(quiz.picked===null && /^[1-4]$/.test(ev.key) && quiz.qs[quiz.i]) answerQuiz(+ev.key-1);
});

function saveScore(id, got, total){
  const sc = store.get('scores',{});
  const prev = sc[id];
  sc[id] = {got, total, done: (total ? got===total : true) || !!(prev && prev.done)};
  store.set('scores',sc); renderSide();
}
function footer(el, e, onCheck, onReset){
  const f = document.createElement('div'); f.className='row'; f.style.marginTop='14px';
  f.innerHTML = `<button class="btn">Prüfen</button><button class="btn ghost" hidden>Nur Fehler nochmal</button><button class="btn ghost">Lösung zeigen</button><button class="btn ghost">Zurücksetzen</button><span class="score"></span>`;
  const [chk, retry, show, rst] = f.querySelectorAll('button'); const out = f.querySelector('.score');
  let revealed = false;
  chk.onclick = () => {
    const [g,t] = onCheck(false), p = g/t;
    out.className = 'score badge '+(p===1?'good':p>=.5?'mid':'low');
    out.textContent = p===1 ? `${g} / ${t} · Perfekt!` : `${g} / ${t} richtig`;
    retry.hidden = p===1;
    if(!revealed) saveScore(e.id,g,t);
  };
  retry.onclick = () => {
    el.querySelectorAll('select.bad, input.bad').forEach(x => { x.value=''; mark(x,null); });
    el.querySelectorAll('.q').forEach(q => { const fb=q.querySelector('.fb'); if(fb && fb.classList.contains('bad')){ q.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on')); fb.textContent=''; fb.className='fb'; } });
    out.textContent=''; out.className='score'; retry.hidden=true;
  };
  show.onclick = () => { revealed = true; onCheck(true); out.className='score badge mid'; out.textContent = 'Lösung eingeblendet (zählt nicht)'; retry.hidden=true; };
  rst.onclick = () => { revealed = false; onReset(); out.textContent=''; out.className='score'; retry.hidden=true; };
  el.appendChild(f);
}
function mark(el, ok){ el.classList.remove('ok','bad'); if(ok!==null) el.classList.add(ok?'ok':'bad'); }

const BUILD = {
  select(el, e){
    el.innerHTML = `<p class="muted">${esc(e.intro)}</p>` + e.rows.map((r,i) => `<div class="q"><div>${esc(r[0])}<div class="fb" id="${e.id}fb${i}"></div></div>
      <select data-i="${i}"><option value="">–</option>${e.opts.map(o => `<option>${o}</option>`).join('')}</select></div>`).join('');
    const sels = [...el.querySelectorAll('select')];
    footer(el, e, reveal => { let g=0; sels.forEach((s,i) => { const r=e.rows[i]; if(reveal) s.value=r[1]; const ok=s.value===r[1]; g+=ok; mark(s,ok);
      const fb=$('#'+e.id+'fb'+i); fb.className='fb '+(ok?'ok':'bad'); fb.innerHTML = ok ? (r[2]?esc(r[2]):'') : 'Richtig wäre: '+(e.prefix ?? 'Sektor ')+r[1]+(r[2]?' · '+esc(r[2]):''); }); return [g,sels.length]; },
      () => sels.forEach((s,i) => { s.value=''; mark(s,null); $('#'+e.id+'fb'+i).textContent=''; }));
  },
  triple(el, e){

const SYNC_SKIP = ['lt.theme', 'lt.sync.backup', 'lt.sync.meta', 'lt.sync.linked', 'lt.auth'];
function syncPack(){
  const data = {};
  for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.startsWith('lt.') && !SYNC_SKIP.includes(k)) data[k.slice(3)] = localStorage.getItem(k); }
  return {app:'lerntool-bin26a', v:1, at:new Date().toISOString(), data};
}
function syncParse(txt){
  let o; try{ o = JSON.parse(String(txt).trim()); }catch(e){ throw new Error('Das ist kein gültiger Lerntool-Stand. Kopiere den ganzen Code.'); }
  if(!o || o.app!=='lerntool-bin26a' || !o.data || typeof o.data!=='object') throw new Error('Das ist kein Stand aus diesem Lerntool.');
  for(const [k,v] of Object.entries(o.data)){ let okv = typeof v==='string' && !SYNC_SKIP.includes('lt.'+k); if(okv){ try{ JSON.parse(v); }catch(e){ okv = false; } } if(!okv) throw new Error('Der Stand ist beschädigt. Sichere ihn auf dem anderen Gerät nochmals.'); }
  return o;
}
function syncApply(o){
  const backup = JSON.stringify(syncPack());
  Object.keys(localStorage).filter(k => k.startsWith('lt.') && !SYNC_SKIP.includes(k)).forEach(k => localStorage.removeItem(k));
  Object.entries(o.data).forEach(([k,v]) => localStorage.setItem('lt.'+k, v));
  localStorage.setItem('lt.sync.backup', backup);
  const now = Date.now(), meta = syncMeta(); Object.keys(JSON.parse(backup).data).concat(Object.keys(o.data)).forEach(k => { if(cloudKey(k)) meta[k] = now; }); lsSet('sync.meta', meta);
  location.reload();
}

// Diese zwei Werte sind laut Firebase öffentlich. Geschützt wird über die Firestore-Regeln: jedes Konto liest und schreibt nur sein eigenes Dokument.
const FB = {apiKey:'AIzaSyBESKEyaqqZaoMrg2JExB9iLIFT2leBPU8', projectId:'lerntool-bin26a'};
const fbOn = () => !!(FB.apiKey && FB.projectId);
const CLOUD_LOCAL = ['theme', 'design', 'subject', 'tab', 'auth', 'grpseen', 'grppub', 'grplast'];   // gilt nur für dieses Gerät
const cloudKey = k => !CLOUD_LOCAL.includes(k) && !k.startsWith('sync.');
const CL = {status:'off', msg:'', last:0, busy:false, again:false, timer:null, pending:null};
const lsGet = k => { try{ return JSON.parse(localStorage.getItem('lt.'+k) || 'null'); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem('lt.'+k, JSON.stringify(v)); }catch(e){} };
const syncMeta = () => lsGet('sync.meta') || {};
// Jede Änderung bekommt einen Zeitstempel, damit beim Abgleich die neuere gewinnt
const storeSetRaw = store.set;
store.set = (k, v) => { storeSetRaw(k, v); if(cloudKey(k)){ const m = syncMeta(); m[k] = Date.now(); lsSet('sync.meta', m); cloudSoon(); } };

function localEntries(){
  const m = syncMeta(), e = {};
  for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(!k.startsWith('lt.')) continue; const s = k.slice(3); if(cloudKey(s)) e[s] = {v:localStorage.getItem(k), t:m[s] || 0}; }
  Object.keys(m).forEach(s => { if(cloudKey(s) && !(s in e)) e[s] = {v:null, t:m[s]}; });   // gelöscht
  return e;
}
const entV = x => x && x.v != null ? x.v : null;
function mergeEntries(loc, rem){
  const out = {};
  new Set([...Object.keys(loc), ...Object.keys(rem)]).forEach(k => { const a = loc[k], b = rem[k]; out[k] = !a ? b : !b ? a : ((a.t||0) > (b.t||0) ? a : b); });
  return out;
}
function applyLocal(ent){
  const m = syncMeta(), changed = [];
  Object.entries(ent).forEach(([k,x]) => { if(!cloudKey(k)) return; const v = entV(x);
    if(v !== localStorage.getItem('lt.'+k)){ try{ if(v===null) localStorage.removeItem('lt.'+k); else localStorage.setItem('lt.'+k, v); }catch(e){} changed.push(k); }
    if(x.t) m[k] = x.t; });
  lsSet('sync.meta', m);
  return changed;
}

async function fbFetch(url, opt){

  let j = {}; try{ j = await r.json(); }catch(e){} return {r, j};

async function fbAuth(path, body){

async function fbToken(){

  const {r, j} = await fbFetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FB.apiKey)}`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.rt)});
  if(!r.ok){ if(r.status===400 || r.status===403){ localStorage.removeItem('lt.auth'); localStorage.removeItem('lt.sync.linked'); throw new Error(fbMsg(j.error && j.error.message)); } throw new Error('Die Anmeldung liess sich nicht erneuern.'); }
  const nx = {...a, id:j.id_token, rt:j.refresh_token, exp:Date.now() + (+j.expires_in || 3600)*1000}; lsSet('auth', nx); return nx;
